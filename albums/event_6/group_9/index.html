<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VRC World Travel Slideshow</title>
  <style>
    :root {
      color-scheme: dark;
      --bg-a: #07111f;
      --bg-b: #11253d;
      --fg: #f3f6fb;
      --muted: rgba(243, 246, 251, 0.72);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      color: var(--fg);
      background:
        radial-gradient(circle at top, rgba(140, 187, 255, 0.18), transparent 32%),
        linear-gradient(160deg, var(--bg-a), var(--bg-b));
      display: grid;
      place-items: center;
    }
    main {
      width: min(96vw, 1440px);
      padding: 24px;
    }
    .frame {
      position: relative;
      aspect-ratio: 16 / 9;
      border-radius: 18px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.06);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }
    img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0;
      transition: opacity 900ms ease-in-out;
      background: rgba(0, 0, 0, 0.28);
    }
    img.active { opacity: 1; }
    .meta {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 12px;
      font-size: 14px;
      color: var(--muted);
    }
    @media (max-width: 700px) {
      main { padding: 12px; }
      .frame { aspect-ratio: 4 / 3; }
      .meta {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="frame" id="frame"></div>
    <div class="meta">
      <span id="counter"></span>
      <span>Generated at 2026-06-09T23:59:16+09:00</span>
    </div>
  </main>
  <script>
    const images = ["01.jpg", "02.jpg", "03.jpg", "04.jpg", "05.jpg", "06.jpg", "07.jpg", "08.jpg", "09.jpg", "10.jpg", "11.jpg", "12.jpg", "13.jpg", "14.jpg", "15.jpg"];
    const frame = document.getElementById("frame");
    const counter = document.getElementById("counter");
    const nodes = images.map((src, index) => {
      const img = document.createElement("img");
      img.src = src;
      img.alt = `Slide ${index + 1}`;
      frame.appendChild(img);
      return img;
    });

    let current = 0;
    const render = () => {
      nodes.forEach((node, index) => {
        node.classList.toggle("active", index === current);
      });
      counter.textContent = `${current + 1} / ${images.length}`;
    };

    render();
    if (nodes.length > 1) {
      setInterval(() => {
        current = (current + 1) % nodes.length;
        render();
      }, 5000);
    }
  </script>
</body>
</html>
